{% extends "base.html" %}
{% block content %}
<p class="tagline">Ask a question. Vote for a friend. Laugh at the results.</p>
<form class="panel" method="post" action="/rooms">
    <h2>🎉 New game</h2>
    <input name="name" placeholder="Your name" maxlength="20" required>
    <button class="primary">Create room</button>
</form>
<div class="divider">or</div>
<form class="panel" method="post" action="/join">
    <h2>🚪 Join a game</h2>
    <input class="code-input" name="code" placeholder="Room code" maxlength="4" required>
    <input name="name" placeholder="Your name" maxlength="20" required>
    <button class="primary">Join</button>
</form>
{% endblock %}
