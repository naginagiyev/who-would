<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Who Would</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 24px 16px;
            display: flex; justify-content: center; align-items: flex-start;
            font-family: "Fredoka", system-ui, sans-serif; color: #2b1748;
            background: linear-gradient(135deg, #7c3aed, #db2777 60%, #f59e0b) fixed;
        }
        .card {
            width: 100%; max-width: 460px; padding: 24px; border-radius: 28px; background: #fff;
            box-shadow: 0 20px 50px rgba(40, 0, 80, 0.35); animation: pop 0.4s ease-out;
        }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }
        h1 { margin: 0 0 16px; text-align: center; font-size: 2.2rem; }
        .title {
            background: linear-gradient(90deg, #7c3aed, #db2777);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h2, h3 { margin: 0 0 12px; }
        input, button { width: 100%; font: inherit; font-size: 1.05rem; margin: 6px 0; border-radius: 14px; }
        input { padding: 12px 14px; border: 2px solid #eadcff; outline: none; }
        input:focus { border-color: #a855f7; }
        button { padding: 12px; border: 0; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.97); }
        .primary {
            color: #fff; background: linear-gradient(90deg, #7c3aed, #db2777);
            box-shadow: 0 6px 16px rgba(219, 39, 119, 0.35);
        }
        .panel { padding: 16px; border-radius: 20px; background: #faf5ff; }
        .divider { margin: 12px 0; text-align: center; font-weight: 600; color: #a78bca; }
        .tagline, .muted { text-align: center; color: #7a6a93; }
        .code-box {
            margin-bottom: 16px; padding: 10px; text-align: center; border-radius: 18px;
            background: #faf5ff; border: 2px dashed #c4a5f5;
        }
        .code-box span { display: block; font-size: 0.85rem; color: #7a6a93; }
        .code { font-size: 2.2rem; letter-spacing: 10px; color: #7c3aed; }
        .code-input { text-transform: uppercase; letter-spacing: 4px; }
        .players { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
        .chip {
            display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px;
            border-radius: 999px; background: #f3ecff;
        }
        .chip.me { outline: 2px solid #a855f7; }
        .chip small { padding: 1px 6px; font-size: 0.7rem; border-radius: 999px; background: #fff; color: #7c3aed; }
        .avatar {
            width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #fff;
        }
        .question {
            margin-bottom: 12px; padding: 18px; text-align: center; font-size: 1.35rem; font-weight: 600;
            border-radius: 20px; color: #fff; background: linear-gradient(135deg, #f59e0b, #db2777);
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid form { margin: 0; }
        .vote {
            display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0;
            background: #faf5ff; border: 2px solid #eadcff;
        }
        .vote:hover { border-color: #a855f7; }
        .vote .avatar { width: 44px; height: 44px; font-size: 1.2rem; }
        .waiting { padding: 14px; text-align: center; font-size: 1.1rem; border-radius: 16px; background: #ecfdf5; color: #047857; }
        .progress { height: 10px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: #f3ecff; }
        .progress div { height: 100%; background: linear-gradient(90deg, #7c3aed, #db2777); }
        .results { margin: 0; padding: 0; list-style: none; }
        .result { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px 10px; padding: 8px 0; }
        .bar { grid-column: 2 / 4; height: 8px; overflow: hidden; border-radius: 999px; background: #f3ecff; }
        .bar div { height: 100%; background: #c4a5f5; }
        .result.winner { font-weight: 700; }
        .result.winner .bar div { background: linear-gradient(90deg, #f59e0b, #db2777); }
        .host { margin-top: 18px; padding-top: 16px; border-top: 2px dashed #eadcff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🤔 <span class="title">Who Would</span></h1>
        <main id="game">{% block content %}{% endblock %}</main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
